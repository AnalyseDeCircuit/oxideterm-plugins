[package]
name = "oxideterm-vnc-helper"
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"

[dependencies]
des = "0.9"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
ironrdp-cliprdr-format = { git = "https://github.com/AnalyseDeCircuit/IronRDP", rev = "98a3155e9497401e447a2d88bcb2701382232c17" }
native-tls = { version = "0.2", features = ["vendored"] }
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
oxideterm-atomic-file = { git = "https://github.com/AnalyseDeCircuit/oxideterm", rev = "570c541393ad7c7f01e85ba3441c9dab29ac3556" }
oxideterm-pcm-audio = { git = "https://github.com/AnalyseDeCircuit/oxideterm", rev = "570c541393ad7c7f01e85ba3441c9dab29ac3556" }
oxideterm-remote-desktop = { git = "https://github.com/AnalyseDeCircuit/oxideterm", rev = "570c541393ad7c7f01e85ba3441c9dab29ac3556" }
rsasl = { version = "2.3.1", default-features = false, features = ["config_builder", "plain", "provider", "scram-sha-1", "scram-sha-2", "std"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1.23", features = ["v4", "v5", "v7", "serde"] }
zeroize = { version = "1.8", features = ["serde"] }

[workspace]
