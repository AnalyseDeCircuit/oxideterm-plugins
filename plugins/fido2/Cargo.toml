[package]
name = "oxideterm-fido2"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "fido2"
path = "src/main.rs"

[dependencies]
libfido2-sys = "=0.5.1"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["serde"] }

[build-dependencies]
pkg-config = "0.3"
