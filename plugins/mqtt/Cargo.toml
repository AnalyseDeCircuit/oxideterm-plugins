[package]
name = "oxideterm-mqtt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
rumqttc = "=0.25.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
serde_json = "1"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "oxideterm-mqtt"
path = "src/main.rs"
