[package]
name = "oxideterm-certificate-preview"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "certificate-preview"
path = "src/main.rs"

[dependencies]
oxideterm-file-preview-protocol = { path = "../../packages/file-preview-protocol" }
x509-parser = "=0.18.1"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
time = "0.3"
