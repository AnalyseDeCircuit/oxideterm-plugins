[package]
name = "oxideterm-toolbox"
version = "0.2.3"
edition = "2024"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "plugin"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
base64 = "0.22"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
getrandom = "0.3"
regex = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"

[build-dependencies]
serde_json = "1"
