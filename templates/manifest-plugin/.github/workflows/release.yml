name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/checkout@v4
        with:
          repository: AnalyseDeCircuit/oxideterm-plugins
          path: .oxideterm-catalog
      - run: npm --prefix .oxideterm-catalog ci --ignore-scripts
      - name: Prepare host compatibility
        run: node .oxideterm-catalog/scripts/release-plugin.mjs prepare .
      - name: Validate manifest and release tag
        run: node scripts/check.mjs --release-tag "${{ github.ref_name }}"
      - name: Package plugin
        run: npm run package:unix
      - name: Generate marketplace entry
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          identity=$(node -p 'const m = require("./plugin.json"); m.id + "-" + m.version')
          node .oxideterm-catalog/scripts/release-plugin.mjs entry . \
            --release-url "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME" \
            --package "any=dist/$identity.zip" --output dist/catalog-entry.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/catalog-entry.json --generate-notes --notes-file .oxideterm-catalog/docs/catalog-upgrade-notice.md --verify-tag
