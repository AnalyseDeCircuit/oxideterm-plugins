name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest and release tag
        run: node scripts/check.mjs --release-tag "${{ github.ref_name }}"
      - name: Package Unix plugin
        if: runner.os != 'Windows'
        run: npm run package:unix
      - name: Package Windows plugin
        if: runner.os == 'Windows'
        run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag
