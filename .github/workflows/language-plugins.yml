name: Build language plugins

on:
  workflow_dispatch:
    inputs:
      host_ref:
        description: OxideTerm ref to build against; publishing requires a published host release tag
        required: true
        default: main
      plugin_version:
        description: Version shared by these language plugin packages
        required: true
        default: 0.1.0
      publish:
        description: Publish immutable plugin assets after validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOST_REF: ${{ inputs.host_ref }}
      PLUGIN_VERSION: ${{ inputs.plugin_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AnalyseDeCircuit/oxideterm
          ref: ${{ inputs.host_ref }}
          path: host
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm install --prefix .language-tools --no-save tree-sitter-cli@0.27.0
      - name: Prepare host toolchain
        working-directory: host
        run: rustup show active-toolchain
      - name: Build pinned grammars and prepare manifests
        run: node scripts/build-language-plugins.mjs all --host-repo host --version "$PLUGIN_VERSION" --tree-sitter "$PWD/.language-tools/node_modules/.bin/tree-sitter"
      - name: Validate grammar ABI and highlighting in the target host
        working-directory: host
        run: |
          for language in $(node -p "Object.keys(require('../language-plugins/grammars.json')).join(' ')"); do
            cargo run --locked -p oxideterm-editor-syntax --example check_language_plugin -- "../dist/languages/$language"
          done
      - name: Generate marketplace records
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          for language in $(node -p "Object.keys(require('./language-plugins/grammars.json')).join(' ')"); do
            node scripts/release-plugin.mjs record "dist/languages/$language" --release-url "https://github.com/$GH_REPO/releases/download/languages-v$PLUGIN_VERSION" --package "any=dist/languages/com.oxideterm.language.$language-$PLUGIN_VERSION.zip"
          done
          node --input-type=module -e 'import fs from "node:fs"; const index = JSON.parse(fs.readFileSync("registry/v1/index.json")); fs.writeFileSync("dist/languages/catalog-entries.json", JSON.stringify(index.plugins.filter(p => p.id.startsWith("com.oxideterm.language.")), null, 2));'
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: language-plugins
          path: |
            dist/languages/*.zip
            dist/languages/catalog-entries.json
      - name: Verify the host is already released
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C host describe --tags --exact-match)" = "$HOST_REF"
          test "$(gh release view "$HOST_REF" --repo AnalyseDeCircuit/oxideterm --json isDraft --jq .isDraft)" = false
      - name: Publish plugin assets
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "languages-v$PLUGIN_VERSION" dist/languages/*.zip dist/languages/catalog-entries.json --target "$GITHUB_SHA" --title "Language plugins $PLUGIN_VERSION" --generate-notes
