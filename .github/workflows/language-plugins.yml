name: Build language plugin

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language ID under plugins/language-<id>
        required: true
        default: elixir
      host_ref:
        description: OxideTerm ref with the language loader and package verifier
        required: true
        default: main
      publish:
        description: Publish immutable plugin assets after validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LANGUAGE: ${{ inputs.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AnalyseDeCircuit/oxideterm
          ref: ${{ inputs.host_ref }}
          path: host
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm install --prefix .language-tools --no-save tree-sitter-cli@0.27.0
      - name: Prepare host toolchain
        working-directory: host
        run: rustup show active-toolchain
      - name: Build the selected plugin
        run: node scripts/build-language-plugins.mjs "$LANGUAGE" --host-repo host --tree-sitter "$PWD/.language-tools/node_modules/.bin/tree-sitter"
      - name: Validate grammar ABI and highlighting in the target host
        working-directory: host
        run: cargo run --locked -p oxideterm-editor-syntax --example check_language_plugin -- "../dist/languages/$LANGUAGE"
      - name: Read plugin release identity
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const m = JSON.parse(fs.readFileSync(`dist/languages/${process.env.LANGUAGE}/plugin.json`));
          fs.appendFileSync(process.env.GITHUB_ENV, `PLUGIN_ID=${m.id}\nPLUGIN_VERSION=${m.version}\nRELEASE_TAG=language-${process.env.LANGUAGE}-v${m.version}\n`);
          JS
      - name: Generate marketplace record
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/release-plugin.mjs entry "dist/languages/$LANGUAGE" --release-url "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG" --package "any=dist/languages/$PLUGIN_ID-$PLUGIN_VERSION.zip" --output dist/languages/catalog-entry.json
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: language-${{ inputs.language }}
          path: |
            dist/languages/${{ env.PLUGIN_ID }}-${{ env.PLUGIN_VERSION }}.zip
            dist/languages/catalog-entry.json
      - name: Publish plugin assets
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" "dist/languages/$PLUGIN_ID-$PLUGIN_VERSION.zip" dist/languages/catalog-entry.json --target "$GITHUB_SHA" --title "$LANGUAGE language support $PLUGIN_VERSION" --generate-notes --notes-file docs/catalog-upgrade-notice.md --latest=false
