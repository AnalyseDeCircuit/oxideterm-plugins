name: Build MQTT workbench plugin

on:
  push:
    tags: ['mqtt-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, arch: x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - run: rustup toolchain install 1.94.1-${{ matrix.target }} --profile minimal
      - run: rustup default 1.94.1-${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: plugins/mqtt
      - run: cargo test --locked
        working-directory: plugins/mqtt
      - run: npm run package
        working-directory: plugins/mqtt
      - name: Verify packaged executable against a local broker
        run: node scripts/verify-package.mjs
        working-directory: plugins/mqtt
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: mqtt-${{ matrix.target }}
          path: plugins/mqtt/dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/mqtt-v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-plugin.yml
    with:
      plugin: mqtt
      artifacts: mqtt-*
