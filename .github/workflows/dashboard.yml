name: Release Workspace Dashboard

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Dashboard package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - run: npm ci --ignore-scripts
      - run: node --test scripts/host-tools-dashboard.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.os }}
          path: plugins/host-tools-dashboard/dist/*.zip
          if-no-files-found: error

  release:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: workspace-dashboard-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - if: inputs.publish
        run: node scripts/release-plugin.mjs prepare plugins/host-tools-dashboard
      - uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          path: dist/dashboard
          merge-multiple: true
      - name: Record tested platform packages and preserve catalog history
        if: inputs.publish
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { recordRelease } from './scripts/release-plugin.mjs';
          import { readCatalog } from './scripts/catalog-source.mjs';
          import { validateRegistry } from './scripts/validate-registry.mjs';
          const root = 'plugins/host-tools-dashboard';
          const manifest = JSON.parse(fs.readFileSync(`${root}/plugin.json`));
          const tag = `host-tools-dashboard-v${manifest.version}`;
          const catalog = readCatalog();
          const targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin', 'aarch64-unknown-linux-gnu', 'x86_64-unknown-linux-gnu', 'aarch64-pc-windows-msvc', 'x86_64-pc-windows-msvc'];
          const updated = recordRelease(catalog, manifest, `https://github.com/${process.env.GH_REPO}/releases/download/${tag}`, targets.map(target => `${target}=dist/dashboard/host-tools-dashboard-${manifest.version}-${target}.zip`));
          const entry = updated.plugins.find(plugin => plugin.id === manifest.id);
          entry.name = manifest.name;
          entry.description = manifest.description;
          entry.capabilitiesSummary = ['Recent work and pinned shortcuts', 'Active tasks and workspace issues'];
          validateRegistry(updated);
          fs.writeFileSync('dist/dashboard/catalog-entry.json', JSON.stringify(entry, null, 2) + '\n');
          fs.writeFileSync('dist/dashboard/release-notes.md', `## 中文\n\n工作概览 ${manifest.version}：新增 Windows x64/ARM64 安装包和专用启动入口，六个平台分别验证实际安装包。\n\n需要 OxideTerm ${manifest.engines.oxideterm}，以及 PATH 中可用的 Node.js。功能与权限保持不变。\n\n## English\n\nWorkspace Dashboard ${manifest.version} adds Windows x64/ARM64 packages with a dedicated launcher. The actual packages are tested on all six platforms.\n\nRequires OxideTerm ${manifest.engines.oxideterm} and Node.js on PATH. Features and permissions are unchanged.\n`);
          fs.appendFileSync('dist/dashboard/release-notes.md', '\n' + fs.readFileSync('docs/catalog-upgrade-notice.md', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\nPLUGIN_VERSION=${manifest.version}\n`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-release
          path: dist/dashboard/
          if-no-files-found: error
      - name: Publish immutable Dashboard assets
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/dashboard/*.zip dist/dashboard/catalog-entry.json \
            --target "$GITHUB_SHA" --title "Workspace Dashboard $PLUGIN_VERSION" \
            --notes-file dist/dashboard/release-notes.md --draft --latest=false
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
