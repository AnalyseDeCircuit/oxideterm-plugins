name: Validate plugin registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-registry.mjs
      - run: node scripts/validate-plugins.mjs
      - name: Install WASM target
        run: rustup target add wasm32-wasip1
      - name: Create standalone plugins
        run: |
          node scripts/create-plugin.mjs generated-manifest --type manifest --id com.example.generated-manifest --name "Generated Manifest Plugin" --author "OxideTerm CI"
          node scripts/create-plugin.mjs generated-process --type process --id com.example.generated-process --name "Generated Process Plugin" --author "OxideTerm CI"
          node scripts/create-plugin.mjs generated-wasm --type wasm --id com.example.generated-wasm --name "Generated WASM Plugin" --author "OxideTerm CI"
      - name: Validate standalone plugins
        run: |
          npm --prefix generated-manifest run check
          npm --prefix generated-process run check
          npm --prefix generated-wasm run check
      - name: Package Unix plugins
        if: runner.os != 'Windows'
        run: |
          generated-manifest/scripts/package.sh
          generated-process/scripts/package.sh
          generated-wasm/scripts/package.sh
      - name: Package Windows plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./generated-manifest/scripts/package.ps1
          ./generated-process/scripts/package.ps1
          ./generated-wasm/scripts/package.ps1
