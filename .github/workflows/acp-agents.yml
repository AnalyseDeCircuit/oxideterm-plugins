name: Build ACP agent plugins

on:
  push:
    tags: ['codex-acp-v*', 'claude-code-acp-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(startsWith(github.ref, 'refs/tags/codex-acp-v') && '["codex-acp"]' || startsWith(github.ref, 'refs/tags/claude-code-acp-v') && '["claude-code-acp"]' || '["codex-acp","claude-code-acp"]') }}
        platform:
          - { os: macos-14, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, arch: x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.os }}
    env:
      ACP_TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.platform.arch }}
      - run: rustup toolchain install 1.94.1-${{ matrix.platform.target }} --profile minimal
      - run: rustup default 1.94.1-${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/${{ matrix.plugin }}
      - run: npm ci --ignore-scripts
      - run: node scripts/release-plugin.mjs prepare plugins/${{ matrix.plugin }} --host-range '>2.2.1'
      - run: node scripts/build-acp-agent.mjs ${{ matrix.plugin }}
      - run: node scripts/verify-acp-agent.mjs ${{ matrix.plugin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.platform.target }}
          path: plugins/${{ matrix.plugin }}/dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: dist/acp
          merge-multiple: true
      - name: Record verified platform packages
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { recordRelease } from './scripts/release-plugin.mjs';
          const tag = process.env.GITHUB_REF_NAME;
          const name = tag.startsWith('codex-acp-v') ? 'codex-acp' : 'claude-code-acp';
          const manifest = JSON.parse(fs.readFileSync(`plugins/${name}/plugin.json`));
          if (tag !== `${name}-v${manifest.version}`) throw new Error('Release tag and manifest version differ');
          const targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu', 'x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc'];
          const catalog = JSON.parse(fs.readFileSync('registry/v1/index.json'));
          const updated = recordRelease(catalog, manifest, `https://github.com/${process.env.GH_REPO}/releases/download/${tag}`, targets.map(target => `${target}=dist/acp/${name}-${manifest.version}-${target}.zip`));
          fs.writeFileSync('dist/acp/catalog-entry.json', JSON.stringify(updated.plugins.find(entry => entry.id === manifest.id), null, 2) + '\n');
          for (const file of fs.readdirSync('dist/acp')) {
            if (file.endsWith('.zip') && !file.startsWith(`${name}-`)) fs.unlinkSync(`dist/acp/${file}`);
          }
          fs.writeFileSync('dist/acp/release-notes.md', `${manifest.name} ${manifest.version}\n\nNative ACP adapter packages for macOS, Linux and Windows on x64 and ARM64. Requires OxideTerm ${manifest.engines.oxideterm} and the installed, authenticated upstream CLI.\n`);
          NODE
      - name: Publish immutable plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/acp/*.zip dist/acp/catalog-entry.json --verify-tag --title "$RELEASE_TAG" --notes-file dist/acp/release-notes.md --draft --latest=false
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
