name: Validate host source plugins

on:
  push:
    tags: ['tailscale-hosts-v*', 'ansible-inventory-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
      - run: node plugins/tailscale-hosts/scripts/check.mjs
      - run: node plugins/ansible-inventory/scripts/check.mjs
      - run: node --test scripts/host-sources.test.mjs
      - if: startsWith(github.ref, 'refs/tags/tailscale-hosts-v')
        run: node scripts/release-plugin.mjs prepare plugins/tailscale-hosts
      - if: startsWith(github.ref, 'refs/tags/ansible-inventory-v')
        run: node scripts/release-plugin.mjs prepare plugins/ansible-inventory
      - run: node scripts/build-host-source.mjs tailscale-hosts --package
      - if: runner.os != 'Windows'
        run: node scripts/build-host-source.mjs ansible-inventory --package
      - uses: actions/upload-artifact@v4
        with:
          name: host-sources-${{ matrix.os }}
          path: |
            plugins/tailscale-hosts/dist/*.zip
            plugins/ansible-inventory/dist/*.zip
          if-no-files-found: error

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/tailscale-hosts-v') || startsWith(github.ref, 'refs/tags/ansible-inventory-v')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-plugin.yml
    with:
      plugin: ${{ startsWith(github.ref, 'refs/tags/tailscale-hosts-v') && 'tailscale-hosts' || 'ansible-inventory' }}
      artifacts: host-sources-*
      targets: ${{ startsWith(github.ref, 'refs/tags/tailscale-hosts-v') && 'aarch64-apple-darwin,x86_64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu,aarch64-pc-windows-msvc,x86_64-pc-windows-msvc' || 'aarch64-apple-darwin,x86_64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu' }}
