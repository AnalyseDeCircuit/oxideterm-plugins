name: Build inspection preview plugins

on:
  push:
    branches: [main]
    tags: ['certificate-preview-v*', 'binary-preview-v*']
    paths:
      - 'plugins/certificate-preview/**'
      - 'plugins/binary-preview/**'
      - 'packages/file-preview-protocol/**'
      - 'scripts/build-inspection-plugin.mjs'
      - 'scripts/verify-inspection-plugin.mjs'
      - 'scripts/release-plugin.mjs'
      - '.github/workflows/inspection-previews.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(startsWith(github.ref, 'refs/tags/certificate-preview-v') && '["certificate-preview"]' || startsWith(github.ref, 'refs/tags/binary-preview-v') && '["binary-preview"]' || '["certificate-preview","binary-preview"]') }}
        platform:
          - { os: macos-14, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, arch: x64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.platform.arch }}
      - run: rustup toolchain install 1.94.1-${{ matrix.platform.target }} --profile minimal
      - run: rustup default 1.94.1-${{ matrix.platform.target }}
      - run: npm ci --ignore-scripts
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-plugin.mjs prepare plugins/${{ matrix.plugin }}
      - run: node scripts/build-inspection-plugin.mjs ${{ matrix.plugin }}
      - run: node scripts/verify-inspection-plugin.mjs ${{ matrix.plugin }}
      - uses: actions/upload-artifact@v4
        with:
          name: inspection-${{ matrix.plugin }}-${{ matrix.platform.target }}
          path: plugins/${{ matrix.plugin }}/dist/*.zip
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/publish-plugin.yml
    with:
      plugin: ${{ startsWith(github.ref_name, 'certificate-preview-') && 'certificate-preview' || 'binary-preview' }}
      artifacts: ${{ startsWith(github.ref_name, 'certificate-preview-') && 'inspection-certificate-preview-*' || 'inspection-binary-preview-*' }}
